# typos (https://github.com/crate-ci/typos) configuration.
#
# Entries are checked false positives from a real run, not guesses.

[files]
extend-exclude = [
  # cocogitto writes a short SHA into every changelog line.
  "CHANGELOG.md",
  "Cargo.lock",
  "*.lock",
  "**/*.json",
  # Generated round constants: megabytes of hex, not prose.
  "**/constants*.rs",
]

[default]
extend-ignore-re = [
  # Commit SHAs in vendoring/provenance comments.
  "@ [0-9a-f]{7,40}\\b",
  # Rust byte-string literals are opaque fixtures, not prose.
  "b\"[A-Za-z0-9_]*\"",
]

[default.extend-words]
# Correct English the dictionary flags as near-misses.
mis = "mis"
unparseable = "unparseable"
# Cryptography and protocol vocabulary.
poseidon = "poseidon"
merkle = "merkle"
nullifier = "nullifier"
blst = "blst"
bls = "bls"
attester = "attester"
attesters = "attesters"
# Round-constant tables are generated data, not prose.

# Exact identifiers, not prose. `extend-identifiers` matches the whole symbol,
# so it cannot mask a real typo in surrounding text the way a word entry can.
[default.extend-identifiers]
# The error variant for a u64 -> u8 narrowing.
U64Tou8 = "U64Tou8"
